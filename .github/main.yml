name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # Hakbang para pumasok sa tamang folder kung nasaan ang pubspec.yaml mo
      - name: Install dependencies
        run: |
          cd lotto_picker/lotto_picker
          flutter pub get

      # Hakbang para i-generate ang astig mong app icon
      - name: Generate Launcher Icons
        run: |
          cd lotto_picker/lotto_picker
          flutter pub run flutter_launcher_icons

      # Hakbang para iluto ang mismong APK
      - name: Build APK
        run: |
          cd lotto_picker/lotto_picker
          flutter build apk --release

      # Hakbang para ilabas ang natapos na file para ma-download mo
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: lotto_picker/lotto_picker/build/app/outputs/flutter-apk/app-release.apk
