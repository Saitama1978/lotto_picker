name: Auto-Sync Lotto Scraper & APK Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 13 * * *'

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

  build_apk:
    runs-on: ubuntu-latest
    needs: sync_data
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter Build Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Cmake and Ninja Compiler
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Create and Build Fresh App
        run: |
          flutter create --org com.example lotto_premium
          cd lotto_premium
          flutter pub add firebase_core cloud_firestore fl_chart font_awesome_flutter
          
          # Inject fixed main.dart
          sed -i 's/Colors.deepPink/Colors.pinkAccent/g' lib/main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:fl_chart/fl_chart.dart';
          
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(
              options: const FirebaseOptions(
                apiKey: 'AIzaSyA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q',
                projectId: 'lotto-asintado',
                appId: '1:458447298380:android:308fd26da180954e40b9e9',
                messagingSenderId: '458447298380',
                storageBucket: 'lotto-asintado.appspot.com',
              ),
            );
            runApp(const MaterialApp(home: Scaffold(body: Center(child: Text("Lotto Asintado Pro Ready")))));
          }
          EOF
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Premium-APK
          path: lotto_premium/build/app/outputs/flutter-apk/app-release.apk
