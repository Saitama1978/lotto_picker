name: Auto-Sync Lotto Scraper & APK Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 13 * * *'

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

  build_apk:
    runs-on: ubuntu-latest
    needs: sync_data
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Build Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Cmake and Ninja Compiler
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Fetch App Package Dependencies
        run: flutter pub get

      - name: Compile and Build Release APK
        run: flutter build apk --release

      - name: Generate and Upload Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Premium-APK
          path: build/app/outputs/flutter-apk/app-release.apk
