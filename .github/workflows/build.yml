name: Auto-Sync Lotto Scraper & APK Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -d "lotto_picker" ]; then
            cd lotto_picker
            npm install firebase-admin axios
            node scraper.js || true
          else
            echo "Scraper folder not found, skipping..."
          fi

  build_apk:
    runs-on: ubuntu-latest
    needs: sync_data
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Compile and Inject Premium Gold Code
        env:
          # Kinukuha ang mga ligtas na sekreto mula sa GitHub Repository Secrets
          SEC_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          SEC_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          SEC_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          SEC_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          rm -rf lotto_app_built
          flutter create --org com.renantefullo.lottoasintado lotto_app_built
          cd lotto_app_built
          
          # I-install ang google_fonts at Firebase Core/Firestore packages
          flutter pub add google_fonts firebase_core cloud_firestore
          
          # --- SECURE ANDROID INTERNET PERMISSION INJECTOR ---
          # Pinapayagan natin ang release build na makalabas sa internet para makakonekta sa Firestore
          cat << 'EOF' > patch_manifest.py
          import os

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              
              permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              """
              
              if "android.permission.INTERNET" not in content:
                  # Isisingit ang mga permissions pagkatapos ng unang manifest tag
                  index = content.find(">") + 1
                  new_content = content[:index] + permissions + content[index:]
                  with open(manifest_path, 'w') as f:
                      f.write(new_content)
                  print("Android Manifest patch: Permissions injected successfully!")
              else:
                  print("Android Manifest patch: Permissions already exist.")
          else:
              print("Android Manifest patch Error: Manifest file not found!")
          EOF
          python3 patch_manifest.py
          
          # Isulat ang main.dart na may live Connection Diagnostic panel at Firebase dynamic options
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          // Gagamitin natin ito upang malaman kung matagumpay ang initialize
          String firebaseInitStatus = "Initializing...";
          String activeProjectId = "INJECTED_FIREBASE_PROJECT_ID";

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            
            try {
              await Firebase.initializeApp(
                options: const FirebaseOptions(
                  apiKey: "INJECTED_FIREBASE_API_KEY",
                  appId: "INJECTED_FIREBASE_APP_ID",
                  messagingSenderId: "INJECTED_FIREBASE_MESSAGING_SENDER_ID",
                  projectId: "INJECTED_FIREBASE_PROJECT_ID",
                ),
              );
              firebaseInitStatus = "Connected ✅";
            } catch (e) {
              firebaseInitStatus = "Failed: ${e.toString()}";
              print("Firebase Error: $e");
            }
            
            runApp(const LottoAsintadoPremiumApp());
          }

          class LottoAsintadoPremiumApp extends StatelessWidget {
            const LottoAsintadoPremiumApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Lotto Asintado Strategy Pro',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF111115),
                  primaryColor: const Color(0xFFE5A93C),
                ),
                home: const PremiumDashboardScreen(),
              );
            }
          }

          class PremiumDashboardScreen extends StatefulWidget {
            const PremiumDashboardScreen({super.key});

            @override
            State<PremiumDashboardScreen> createState() => _PremiumDashboardScreenState();
          }

          class _PremiumDashboardScreenState extends State<PremiumDashboardScreen> {
            String selectedGame = '6/42 Lotto';
            final List<String> pcsoGames = [
              '6/42 Lotto', '6/45 Mega', '6/49 Super', '6/55 Grand', '6/58 Ultra',
              '6D Lotto', '4D Lotto', '3D Lotto', '2D Lotto'
            ];

            String selectedZodiac = 'Zodiac';
            final TextEditingController _yearController = TextEditingController(text: '1951');
            int currentActiveTab = 1; 

            List<List<int>> savedCombinations = [];
            List<List<int>> currentCombinations = [
              [11, 25, 38, 50, 61, 67],
              [02, 15, 24, 39, 44, 52],
              [07, 18, 22, 31, 49, 55],
              [05, 12, 29, 33, 41, 58],
            ];

            void _recalculateNumbers() {
              setState(() {
                int totalBalls = 6;
                int maxLimit = 42;
                bool allowDuplicates = false;

                if (selectedGame.contains('6/42')) { totalBalls = 6; maxLimit = 42; }
                else if (selectedGame.contains('6/45')) { totalBalls = 6; maxLimit = 45; }
                else if (selectedGame.contains('6/49')) { totalBalls = 6; maxLimit = 49; }
                else if (selectedGame.contains('6/55')) { totalBalls = 6; maxLimit = 55; }
                else if (selectedGame.contains('6/58')) { totalBalls = 6; maxLimit = 58; }
                else if (selectedGame.contains('6D')) { totalBalls = 6; maxLimit = 9; allowDuplicates = true; }
                else if (selectedGame.contains('4D')) { totalBalls = 4; maxLimit = 9; allowDuplicates = true; }
                else if (selectedGame.contains('3D')) { totalBalls = 3; maxLimit = 9; allowDuplicates = true; }
                else if (selectedGame.contains('2D')) { totalBalls = 2; maxLimit = 31; allowDuplicates = true; }

                final uniqueSeed = DateTime.now().millisecondsSinceEpoch;
                
                currentCombinations = List.generate(4, (index) {
                  List<int> combination = [];
                  while (combination.length < totalBalls) {
                    int generatedNum;
                    if (maxLimit == 9) {
                      generatedNum = (uniqueSeed + index * 17 + combination.length * 23) % 10;
                    } else {
                      generatedNum = ((uniqueSeed + index * 11 + combination.length * 13) % maxLimit) + 1;
                    }

                    if (allowDuplicates) {
                      combination.add(generatedNum);
                    } else {
                      if (!combination.contains(generatedNum)) {
                        combination.add(generatedNum);
                      }
                    }
                  }
                  if (!allowDuplicates) combination.sort();
                  return combination;
                });
              });

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text('🎯 Bagong kalkulasyon para sa $selectedGame!'),
                  backgroundColor: const Color(0xFF2C1C4D),
                ),
              );
            }

            void _saveCombination(List<int> combo) {
              setState(() {
                if (!savedCombinations.any((element) => element.toString() == combo.toString())) {
                  savedCombinations.add(combo);
                }
              });
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(
                  content: Text('⭐ Na-save na sa My Combinations!'),
                  backgroundColor: Colors.green,
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF26183B),
                  elevation: 8,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(4),
                        decoration: BoxDecoration(
                          color: const Color(0xFFE5A93C).withOpacity(0.2),
                          shape: BoxShape.circle,
                          border: Border.all(color: const Color(0xFFE5A93C), width: 1.5),
                        ),
                        child: const Icon(Icons.star, color: Color(0xFFE5A93C), size: 20),
                      ),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Text(
                              'LOTTO ASINTADO PRO',
                              style: GoogleFonts.orbitron(fontSize: 13, fontWeight: FontWeight.w800, color: Colors.white),
                            ),
                            Text(
                              'Developer: Renante Fullo | DB: $firebaseInitStatus', 
                              style: TextStyle(
                                fontSize: 9, 
                                color: firebaseInitStatus.startsWith("Connected") ? Colors.greenAccent : Colors.redAccent,
                                fontWeight: FontWeight.bold
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
                body: Column(
                  children: [
                    Container(
                      color: const Color(0xFF1E1233),
                      padding: const EdgeInsets.symmetric(vertical: 4),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceAround,
                        children: [
                          _buildNavigationTab(0, Icons.list_alt, 'MY COMBINATIONS'),
                          _buildNavigationTab(1, Icons.local_fire_department, 'HOT NUMBERS'),
                          _buildNavigationTab(2, Icons.menu_book, 'STRATEGY GUIDE'),
                          _buildNavigationTab(3, Icons.history, 'MY HISTORY'),
                        ],
                      ),
                    ),
                    Expanded(
                      child: IndexedStack(
                        index: currentActiveTab,
                        children: [
                          _buildMyCombinationsTab(),
                          _buildHotNumbersTab(),
                          _buildStrategyGuideTab(),
                          _buildMyHistoryTab(),
                        ],
                      ),
                    ),
                  ],
                ),
                floatingActionButton: currentActiveTab == 1 ? FloatingActionButton(
                  backgroundColor: const Color(0xFF23163A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14), side: const BorderSide(color: Color(0xFFE5A93C), width: 1.5)),
                  onPressed: _recalculateNumbers,
                  child: const Icon(Icons.refresh, color: Color(0xFFE5A93C), size: 28),
                ) : null,
              );
            }

            Widget _buildNavigationTab(int index, IconData icon, String title) {
              bool isCurrent = currentActiveTab == index;
              return Expanded(
                child: GestureDetector(
                  onTap: () => setState(() => currentActiveTab = index),
                  child: Container(
                    padding: const EdgeInsets.symmetric(vertical: 8),
                    decoration: BoxDecoration(border: isCurrent ? const Border(bottom: BorderSide(color: Color(0xFFE5A93C), width: 2.5)) : null),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Icon(icon, color: isCurrent ? const Color(0xFFE5A93C) : Colors.white30, size: 18),
                        const SizedBox(height: 4),
                        Text(title, textAlign: TextAlign.center, style: TextStyle(fontSize: 8, fontWeight: isCurrent ? FontWeight.bold : FontWeight.normal, color: isCurrent ? const Color(0xFFE5A93C) : Colors.white30)),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _buildMyCombinationsTab() {
              return ListView(
                padding: const EdgeInsets.all(12.0),
                children: [
                  const Text('⭐ Saved Target Combinations', style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: Colors.white70)),
                  const SizedBox(height: 12),
                  savedCombinations.isEmpty 
                    ? const Center(child: Padding(padding: EdgeInsets.all(32.0), child: Text('No saved combinations yet.', style: TextStyle(color: Colors.white38))))
                    : ListView.builder(
                        shrinkWrap: true, physics: const NeverScrollableScrollPhysics(),
                        itemCount: savedCombinations.length,
                        itemBuilder: (context, index) => _buildPremiumLottoRow(savedCombinations[index], isSavedView: true),
                      ),
                ],
              );
            }

            Widget _buildHotNumbersTab() {
              return SingleChildScrollView(
                padding: const EdgeInsets.all(12.0),
                child: Column(
                  children: [
                    Container(
                      width: double.infinity, padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(colors: [Color(0xFF241D15), Color(0xFF15151A)]),
                        borderRadius: BorderRadius.circular(16), border: Border.all(color: const Color(0xFFE5A93C).withOpacity(0.4), width: 1.5),
                      ),
                      child: Row(
                        children: [
                          Container(
                            width: 52, height: 52, decoration: BoxDecoration(color: const Color(0xFF3D1614), shape: BoxShape.circle, border: Border.all(color: Colors.redAccent, width: 1.5)),
                            child: Center(child: Text(selectedGame.split(' ')[0], textAlign: TextAlign.center, style: const TextStyle(color: Colors.redAccent, fontSize: 11, fontWeight: FontWeight.bold))),
                          ),
                          const SizedBox(width: 16),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text('Next Draw: $selectedGame', style: const TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.bold)),
                                const Text('Current Estimated Jackpot', style: TextStyle(color: Colors.white38, fontSize: 11)),
                                Text('₱35,500,000', style: GoogleFonts.roboto(color: const Color(0xFFE5A93C), fontSize: 28, fontWeight: FontWeight.bold)),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 14),
                    Row(
                      children: [
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 12), height: 40,
                          decoration: BoxDecoration(color: const Color(0xFF181822), borderRadius: BorderRadius.circular(8), border: Border.all(color: Colors.white12)),
                          child: DropdownButtonHideUnderline(
                            child: DropdownButton<String>(
                              value: selectedGame, dropdownColor: const Color(0xFF181822),
                              items: pcsoGames.map((String value) => DropdownMenuItem<String>(value: value, child: Text(value, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13)))).toList(),
                              onChanged: (newValue) { setState(() { selectedGame = newValue!; _recalculateNumbers(); }); },
                            ),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 14),
                    Row(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Expanded(
                          child: Container(
                            height: 200, padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(color: const Color(0xFF16161C), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('Hot Number Frequency', style: TextStyle(fontSize: 11, color: Colors.white70, fontWeight: FontWeight.bold)),
                                const SizedBox(height: 16),
                                Expanded(
                                  child: Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                    crossAxisAlignment: CrossAxisAlignment.end,
                                    children: [
                                      _buildCustomBar(45, Colors.redAccent, '19'),
                                      _buildCustomBar(38, Colors.orangeAccent, '27'),
                                      _buildCustomBar(32, Colors.greenAccent, '05'),
                                      _buildCustomBar(34, Colors.blueAccent, '41'),
                                      _buildCustomBar(29, Colors.purpleAccent, '12'),
                                      _buildCustomBar(18, Colors.pinkAccent, '33'),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(width: 12),
                        Expanded(
                          child: Container(
                            height: 200, padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(color: const Color(0xFF16161C), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text('Lucky Generator', style: TextStyle(fontSize: 11, color: Colors.white70, fontWeight: FontWeight.bold)),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 10), height: 38,
                                  decoration: BoxDecoration(color: Colors.black38, borderRadius: BorderRadius.circular(6), border: Border.all(color: Colors.white12)),
                                  child: DropdownButtonHideUnderline(
                                    child: DropdownButton<String>(
                                      value: selectedZodiac, isExpanded: true, dropdownColor: const Color(0xFF16161C),
                                      style: const TextStyle(fontSize: 13, color: Colors.white),
                                      items: ['Zodiac', 'Aries', 'Taurus', 'Gemini', 'Leo'].map((String val) => DropdownMenuItem<String>(value: val, child: Text(val))).toList(),
                                      onChanged: (v) => setState(() => selectedZodiac = v!),
                                    ),
                                  ),
                                ),
                                SizedBox(
                                  height: 38,
                                  child: TextField(
                                    controller: _yearController, keyboardType: TextInputType.number, style: const TextStyle(fontSize: 13),
                                    decoration: InputDecoration(
                                      contentPadding: const EdgeInsets.symmetric(horizontal: 10), filled: true, fillColor: Colors.black38, labelText: 'Birth Year', labelStyle: const TextStyle(color: Colors.white38, fontSize: 11),
                                      enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(6), borderSide: const BorderSide(color: Colors.white12)),
                                      focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(6), borderSide: const BorderSide(color: Color(0xFFE5A93C))),
                                    ),
                                  ),
                                ),
                                SizedBox(
                                  width: double.infinity, height: 36,
                                  child: ElevatedButton(
                                    onPressed: _recalculateNumbers,
                                    style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1E1812), side: const BorderSide(color: Color(0xFFE5A93C), width: 1.2), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(6))),
                                    child: const Text('Calculate', style: TextStyle(color: Color(0xFFE5A93C), fontSize: 13, fontWeight: FontWeight.bold)),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 16),
                    ListView.builder(
                      shrinkWrap: true, physics: const NeverScrollableScrollPhysics(),
                      itemCount: currentCombinations.length,
                      itemBuilder: (context, index) => _buildPremiumLottoRow(currentCombinations[index]),
                    ),
                  ],
                ),
              );
            }

            Widget _buildStrategyGuideTab() {
              return ListView(
                padding: const EdgeInsets.all(16.0),
                children: [
                  Text('📐 Pattern Analysis Strategy', style: GoogleFonts.orbitron(fontSize: 14, fontWeight: FontWeight.bold, color: const Color(0xFFE5A93C))),
                  const SizedBox(height: 12),
                  _buildGuideCard('Odd/Even Balancing', 'Ang pinakamataas na tsansa na lumabas sa PCSO ay 3 Odd at 3 Even numbers.'),
                  _buildGuideCard('Hot & Cold Method', 'Pagsamahin ang 2 Hot Numbers at 3 Cold Numbers para sa magandang kombinasyon.'),
                ],
              );
            }

            Widget _buildGuideCard(String title, String desc) {
              return Container(
                margin: const EdgeInsets.only(bottom: 12), padding: const EdgeInsets.all(14),
                decoration: BoxDecoration(color: const Color(0xFF16161C), borderRadius: BorderRadius.circular(10), border: Border.all(color: Colors.white10)),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(title, style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 13)),
                    const SizedBox(height: 6),
                    Text(desc, style: const TextStyle(color: Colors.white54, fontSize: 12, height: 1.4)),
                  ],
                ),
              );
            }

            // === REAL-TIME FIREBASE CONNECTION WITH SYSTEM DIAGNOSTICS ===
            Widget _buildMyHistoryTab() {
              return StreamBuilder<QuerySnapshot>(
                stream: FirebaseFirestore.instance.collection('pcso_data').snapshots(),
                builder: (context, snapshot) {
                  // I-display ang mismong error kung mayroon man upang madaling ma-debug sa phone
                  if (snapshot.hasError) {
                    return Center(
                      child: Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Icon(Icons.error_outline, color: Colors.redAccent, size: 48),
                            const SizedBox(height: 16),
                            const Text('Firestore Connection Error:', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white70)),
                            const SizedBox(height: 8),
                            Text(
                              snapshot.error.toString(), 
                              textAlign: TextAlign.center,
                              style: const TextStyle(color: Colors.redAccent, fontSize: 11)
                            ),
                            const SizedBox(height: 16),
                            Text('Active Project ID in build: $activeProjectId', style: const TextStyle(color: Colors.white38, fontSize: 10)),
                          ],
                        ),
                      ),
                    );
                  }
                  
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const Center(child: CircularProgressIndicator(color: Color(0xFFE5A93C)));
                  }
                  
                  if (!snapshot.hasData || snapshot.data!.docs.isEmpty) {
                    return Center(
                      child: Padding(
                        padding: const EdgeInsets.all(24.0),
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Icon(Icons.cloud_off, color: Colors.white38, size: 48),
                            const SizedBox(height: 16),
                            const Text(
                              'Walang data na nakuha mula sa Firestore pcso_data collection.', 
                              textAlign: TextAlign.center,
                              style: TextStyle(color: Colors.white54)
                            ),
                            const SizedBox(height: 8),
                            Text('Project ID: $activeProjectId', style: const TextStyle(color: Colors.white38, fontSize: 11)),
                          ],
                        ),
                      ),
                    );
                  }

                  final docs = snapshot.data!.docs;

                  return ListView.builder(
                    padding: const EdgeInsets.all(16.0),
                    itemCount: docs.length,
                    itemBuilder: (context, index) {
                      final doc = docs[index];
                      String gameId = doc.id; 
                      final data = doc.data() as Map<String, dynamic>;
                      String resultNumbers = data['result'] ?? 'No Result';

                      return Container(
                        margin: const EdgeInsets.only(bottom: 10), 
                        padding: const EdgeInsets.all(14),
                        decoration: BoxDecoration(
                          color: const Color(0xFF14141A), 
                          borderRadius: BorderRadius.circular(8), 
                          border: Border.all(color: Colors.white10)
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(
                                  gameId.contains('-') ? 'Lotto $gameId' : '$gameId Digit Game', 
                                  style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 13)
                                ),
                                const Text('Latest Result', style: TextStyle(color: Colors.white38, fontSize: 11)),
                              ],
                            ),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                              decoration: BoxDecoration(
                                color: const Color(0xFFE5A93C).withOpacity(0.1),
                                borderRadius: BorderRadius.circular(6),
                                border: Border.all(color: const Color(0xFFE5A93C).withOpacity(0.3))
                              ),
                              child: Text(
                                resultNumbers, 
                                style: GoogleFonts.roboto(
                                  color: const Color(0xFFE5A93C), 
                                  fontWeight: FontWeight.bold, 
                                  fontSize: 14,
                                  letterSpacing: 1.0
                                )
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Widget _buildCustomBar(double heightPercentage, Color barColor, String label) {
              return Column(
                mainAxisAlignment: MainAxisAlignment.end,
                children: [
                  Container(width: 12, height: heightPercentage * 2.2, decoration: BoxDecoration(color: barColor, borderRadius: BorderRadius.circular(3))),
                  const SizedBox(height: 6),
                  Text(label, style: const TextStyle(fontSize: 9, color: Colors.white70, fontWeight: FontWeight.bold)),
                ],
              );
            }

            Widget _buildPremiumLottoRow(List<int> numbers, {bool isSavedView = false}) {
              return Container(
                margin: const EdgeInsets.only(bottom: 10), padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 12),
                decoration: BoxDecoration(color: const Color(0xFF14141A), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                child: Row(
                  children: [
                    const Icon(Icons.star, color: Color(0xFFE5A93C), size: 16),
                    const SizedBox(width: 8),
                    Expanded(
                      child: SingleChildScrollView(
                        scrollDirection: Axis.horizontal,
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceEvenly,
