name: Build Android APK and Update Data

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # =========================================================
      # BAHAGI 1: DATABASE TRIGGER (FIREBASE UPDATE)
      # =========================================================
      - name: Install Firebase Dependency
        run: npm install firebase-admin

      - name: Run Database Update
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          echo "$FIREBASE_KEY" > serviceAccountKey.json
          node -e "
          const admin = require('firebase-admin');
          const serviceAccount = require('./serviceAccountKey.json');
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: 'https://lotto-asintado-default-rtdb.asia-southeast1.firebasedatabase.app'
          });
          const db = admin.database();
          async function run() {
            try {
              await db.ref('pcso_data/3D/result').set('9-2-5');
              await db.ref('pcso_data/3D/history/2pm').set('9-5-2');
              await db.ref('pcso_data/3D/history/5pm').set('4-7-1');
              await db.ref('pcso_data/3D/history/9pm').set('3-0-8');
              console.log('Firebase Updated!');
              process.exit(0);
            } catch(e) {
              console.error(e);
              process.exit(1);
            }
          }
          run();
          "

      # =========================================================
      # BAHAGI 2: GENERATE FRESH APP PARA MAKAIWAS SA V2 EMBEDDING ERROR
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # Gagawa ng bagong malinis na android embedding structure
      - name: Generate Fresh Flutter App Framework
        run: |
          flutter create --platforms android fresh_app

      - name: Configure Android SDK Version for Firebase
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' fresh_app/android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/g' fresh_app/android/app/build.gradle

      - name: Fix Target Icon Code Bug
        run: |
          sed -i 's/Icons.target/Icons.track_changes/g' lotto_picker/lib/main.dart

      # HAHAKUTIN AT PAGSASAMAHIN ANG CODE AT LAHAT NG POSIBLENG LOGO/ICON FILES
      - name: Merge Source Code and Logo Assets
        run: |
          rm -f fresh_app/pubspec.yaml
          cp -r lotto_picker/lib fresh_app/
          cp lotto_picker/pubspec.yaml fresh_app/
          
          # Kopya ng Assets Folder kung mayroon
          if [ -d "lotto_picker/assets" ]; then cp -r lotto_picker/assets fresh_app/; fi
          
          # Hahanapin at kokopyahin ang mga image files kung nasa labas
          find lotto_picker -name "*.png" -exec cp {} fresh_app/ \; 2>/dev/null || true
          find . -maxdepth 1 -name "*.png" -exec cp {} fresh_app/ \; 2>/dev/null || true

      # ISAKSAK ANG KONEKSYON SA DATABASE NG APP
      - name: Inject Firebase Google Services JSON
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -z "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > fresh_app/android/app/google-services.json
          fi

      # LUTUIN ANG LAUNCHER ICON GAMIT ANG HINAKOT NA ATTRIBUTES
      - name: Build Flutter Launcher Icons
        run: |
          cd fresh_app
          flutter pub get
          flutter pub run flutter_launcher_icons:main || true

      - name: Build Final Release APK
        run: |
          cd fresh_app
          flutter build apk --release

      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
