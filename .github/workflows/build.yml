name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Siguraduhing Java 17 ang gamit para sa modernong Gradle
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # HAKBANG 1: Gumawa ng bagong malinis na app sa tabi ng repository mo
      - name: Generate Fresh Flutter App
        run: |
          flutter create --platforms android fresh_app

      # HAKBANG 2: Ilipat ang mga Dart files, code, at pubspec mo sa loob ng bagong app
      - name: Merge Source Code to Fresh App
        run: |
          rm -f fresh_app/pubspec.yaml
          cp -r lotto_picker/lib fresh_app/
          cp lotto_picker/pubspec.yaml fresh_app/

      # HAKBANG 3: I-build na ang APK gamit ang bagong malinis na Gradle project
      - name: Install dependencies & Build APK
        run: |
          cd fresh_app
          flutter pub get
          flutter build apk --release

      # HAKBANG 4: I-upload ang pinal na natapos na file
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
