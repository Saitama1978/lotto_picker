name: Build and Auto-Sync Lotto App

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 🔥 AUTO-SCRAPER SYNC (GREEN CHECK)
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

      # ☕ JAVA SETUP PARA SA ANDROID
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # 📱 FLUTTER COMPILER SETUP
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.10.6' # Tinegsh natin sa 3.10.6 para sa mas stable na Dart compatibility

      # 🛠️ FORCE DEPENDENCY RESOLUTION BYPASS
      - name: Install Dependencies and Build APK
        run: |
          cd lotto_picker
          flutter clean
          # Pipilitin natin si Flutter na i-upgrade ang mga lumang plugins na nag-aaway
          flutter pub upgrade --major-versions --no-example
          flutter pub get
          flutter build apk --release --no-sound-null-safety

      # 🚀 DOWNLOAD LINK NG APK PRODUCT
      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: PH-Lotto-Asintado-Pro
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
