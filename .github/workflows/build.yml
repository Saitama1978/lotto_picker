name: Auto-Sync Lotto Scraper & APK Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -d "lotto_picker" ]; then
            cd lotto_picker
            npm install firebase-admin axios
            node scraper.js || true
          else
            echo "Scraper folder not found, skipping..."
          fi

  build_apk:
    runs-on: ubuntu-latest
    needs: sync_data
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Compile and Inject Premium Gold Code
        run: |
          rm -rf lotto_app_built
          flutter create --org com.renantefullo.lottoasintado lotto_app_built
          cd lotto_app_built
          
          # I-install ang Google Fonts para sa premium typography
          flutter pub add google_fonts
          
          # Isulat ang pinakamagandang main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'dart:math';

          void main() {
            runApp(const LottoAsintadoPremiumApp());
          }

          class LottoAsintadoPremiumApp extends StatelessWidget {
            const LottoAsintadoPremiumApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Lotto Asintado Strategy Pro',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F0E13), // Napaka-dark na ube-black
                  primaryColor: const Color(0xFFE5A93C), // Premium Gold Accent
                ),
                home: const PremiumDashboardScreen(),
              );
            }
          }

          class PremiumDashboardScreen extends StatefulWidget {
            const PremiumDashboardScreen({super.key});
            @override
            State<PremiumDashboardScreen> createState() => _PremiumDashboardScreenState();
          }

          class _PremiumDashboardScreenState extends State<PremiumDashboardScreen> {
            // Mga Variables para sa Interactive State Management
            String selectedGame = '6/42';
            String selectedZodiac = 'Zodiac';
            final TextEditingController _yearController = TextEditingController(text: '1951');
            int currentActiveTab = 2; // Strategy Guide bilang active base sa larawan mo
            bool isCalculating = false;

            // Listahan ng mga laro at ang kanilang jackpot pools
            final Map<String, String> jackpotPools = {
              '6/42': '₱35,500,000',
              '6/45': '₱58,200,000',
              '6/49': '₱124,600,000',
              '6/55': '₱210,400,000',
              '6/58': '₱380,100,000',
            };

            // Simulang hawak na mga kombinasyon (Gaya ng nasa mockup mo)
            List<List<int>> currentCombinations = [
              [11, 25, 38, 50, 67],
              [11, 25, 38, 50, 67],
              [11, 25, 38, 50, 67],
              [11, 25, 38, 50, 67],
            ];

            // Formula sa pag-kalkula gamit ang Birth Year at Zodiac Sign
            void _calculateLuckyCombination() {
              setState(() {
                isCalculating = true;
              });

              // Magkaroon ng kunwaring computational delay para sa premium feel
              Future.delayed(const Duration(milliseconds: 1200), () {
                if (!mounted) return;
                setState(() {
                  isCalculating = false;
                  
                  // Kumuha ng seed values base sa taon at zodiac string length
                  int yearVal = int.tryParse(_yearController.text) ?? 1951;
                  int zodiacSeed = selectedZodiac.length * 7;
                  int maxBallRange = selectedGame == '6/42' ? 42 : (selectedGame == '6/45' ? 45 : 55);
                  if (selectedGame == '6/58') maxBallRange = 58;

                  final randomGenerator = Random(yearVal + zodiacSeed + DateTime.now().millisecondsSinceEpoch);

                  currentCombinations = List.generate(4, (index) {
                    Set<int> numSet = {};
                    while (numSet.length < 5) {
                      int generated = randomGenerator.nextInt(maxBallRange) + 1;
                      numSet.add(generated);
                    }
                    List<int> sortedCombi = numSet.toList();
                    sortedCombi.sort();
                    return sortedCombi;
                  });
                });

                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('🎯 Nagtagumpay ang kalkulasyon para sa $selectedGame Lotto!'),
                    backgroundColor: const Color(0xFF2E194F),
                    behavior: SnackBarBehavior.floating,
                  ),
                );
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                // --- APP BAR (Premium Dark-Purple at Gold Theme) ---
                appBar: AppBar(
                  backgroundColor: const Color(0xFF201335), // Ube header
                  elevation: 6,
                  leading: IconButton(
                    icon: const Icon(Icons.arrow_back, color: Colors.white70),
                    onPressed: () {},
                  ),
                  title: Row(
                    children: [
                      // Gintong Star Emblem (Custom Graphic Crest)
                      Container(
                        padding: const EdgeInsets.all(5),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(
                            colors: [Color(0xFFFFD700), Color(0xFFB8860B)],
                            begin: Alignment.topLeft,
                            end: Alignment.bottomRight,
                          ),
                          shape: BoxShape.circle,
                          boxShadow: [
                            BoxShadow(
                              color: const Color(0xFFFFD700).withOpacity(0.3),
                              blurRadius: 6,
                              offset: const Offset(0, 2),
                            )
                          ],
                        ),
                        child: const Icon(Icons.star, color: Color(0xFF201335), size: 18),
                      ),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Text(
                              'LOTTO ASINTADO STRATEGY PRO',
                              style: GoogleFonts.orbitron(
                                fontSize: 13,
                                fontWeight: FontWeight.bold,
                                color: Colors.white,
                                letterSpacing: 0.8,
                              ),
                            ),
                            const Text(
                              'Developer: Renante Fullo',
                              style: TextStyle(fontSize: 10, color: Colors.white54, fontWeight: FontWeight.w400),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(icon: const Icon(Icons.folder_open, color: Colors.white70, size: 20), onPressed: () {}),
                    IconButton(icon: const Icon(Icons.fullscreen, color: Colors.white70, size: 20), onPressed: () {}),
                    IconButton(icon: const Icon(Icons.settings, color: Colors.white70, size: 20), onPressed: () {}),
                  ],
                ),
                body: Column(
                  children: [
                    // --- SUB-HEADER NAVIGATION TABS ---
                    Container(
                      color: const Color(0xFF190E2C), // Mas madilim na ube bar sa ilalim
                      padding: const EdgeInsets.symmetric(vertical: 6),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceAround,
                        children: [
                          _buildTabItem(0, Icons.list_alt, 'MY COMBINATIONS'),
                          _buildTabItem(1, Icons.local_fire_department, 'HOT NUMBERS'),
                          _buildTabItem(2, Icons.menu_book, 'STRATEGY GUIDE'),
                          _buildTabItem(3, Icons.history, 'MY HISTORY'),
                        ],
                      ),
                    ),
                    
                    // Main Dashboard Content
                    Expanded(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.all(12.0),
                        child: Column(
                          children: [
                            // --- TOP DRAW & JACKPOT CARD ---
                            Container(
                              width: double.infinity,
                              padding: const EdgeInsets.all(16),
                              decoration: BoxDecoration(
                                gradient: const LinearGradient(
                                  colors: [Color(0xFF261D15), Color(0xFF131317)],
                                  begin: Alignment.topLeft,
                                  end: Alignment.bottomRight,
                                ),
                                borderRadius: BorderRadius.circular(16),
                                border: Border.all(color: const Color(0xFFE5A93C).withOpacity(0.35), width: 1.5),
                              ),
                              child: Row(
                                children: [
                                  // Red Lotto Badge Circle
                                  Container(
                                    width: 50,
                                    height: 50,
                                    decoration: BoxDecoration(
                                      color: const Color(0xFF3B1514),
                                      shape: BoxShape.circle,
                                      border: Border.all(color: Colors.redAccent, width: 1.5),
                                    ),
                                    child: const Center(
                                      child: Text(
                                        '6/42\nLOTTO',
                                        textAlign: TextAlign.center,
                                        style: TextStyle(color: Colors.redAccent, fontSize: 10, fontWeight: FontWeight.black, height: 1.1),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(width: 14),
                                  // Jackpot Details
                                  Expanded(
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        Text('Next Draw: $selectedGame Lotto', style: const TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.bold)),
                                        const Text('Current Estimated Jackpot', style: TextStyle(color: Colors.white38, fontSize: 10)),
                                        const SizedBox(height: 3),
                                        Text(
                                          jackpotPools[selectedGame] ?? '₱35,500,000',
                                          style: GoogleFonts.montserrat(
                                            color: const Color(0xFFE5A93C),
                                            fontSize: 26,
                                            fontWeight: FontWeight.bold,
                                            letterSpacing: 0.5,
                                          ),
                                        ),
                                      ],
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(height: 14),

                            // --- FILTERS BAR (Select game, icons, settings) ---
                            Row(
                              children: [
                                // Interactive Dropdown Selector
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 10),
                                  height: 36,
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF17161D),
                                    borderRadius: BorderRadius.circular(8),
                                    border: Border.all(color: Colors.white12),
                                  ),
                                  child: DropdownButtonHideUnderline(
                                    child: DropdownButton<String>(
                                      value: selectedGame,
                                      dropdownColor: const Color(0xFF17161D),
                                      style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 13),
                                      items: ['6/42', '6/45', '6/49', '6/55', '6/58'].map((String val) {
                                        return DropdownMenuItem<String>(value: val, child: Text(val));
                                      }).toList(),
                                      onChanged: (newVal) {
                                        setState(() {
                                          selectedGame = newVal!;
                                        });
                                      },
                                    ),
                                  ),
                                ),
                                const SizedBox(width: 8),
                                _buildSquareActionBtn(Icons.trending_up),
                                const SizedBox(width: 5),
                                _buildSquareActionBtn(Icons.bar_chart),
                                const Spacer(),
                                IconButton(
                                  icon: const Icon(Icons.settings, color: Colors.white54, size: 20),
                                  onPressed: () {},
                                ),
                              ],
                            ),
                            const SizedBox(height: 14),

                            // --- MIDDLE DUAL-PANELS (Interactive custom Chart & Lucky Form) ---
                            Row(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                // Kaliwa: Ang ating magandang Custom Chart
                                Expanded(
                                  child: Container(
                                    height: 195,
                                    padding: const EdgeInsets.all(10),
                                    decoration: BoxDecoration(
                                      color: const Color(0xFF131217),
                                      borderRadius: BorderRadius.circular(12),
                                      border: Border.all(color: Colors.white10),
                                    ),
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        const Text('Hot Number Frequency', style: TextStyle(fontSize: 10, color: Colors.white70, fontWeight: FontWeight.bold)),
                                        const SizedBox(height: 15),
                                        Expanded(
                                          child: Row(
                                            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                            crossAxisAlignment: CrossAxisAlignment.end,
                                            children: [
                                              _buildCustomBarIndicator(45, const Color(0xFFE94560), '1'),
                                              _buildCustomBarIndicator(40, const Color(0xFFFFA34D), '2'),
                                              _buildCustomBarIndicator(35, const Color(0xFF53D296), '3'),
                                              _buildCustomBarIndicator(36, const Color(0xFF42A5F5), '4'),
                                              _buildCustomBarIndicator(33, const Color(0xFF8E24AA), '5'),
                                              _buildCustomBarIndicator(18, const Color(0xFFE91E63), '6'),
                                            ],
                                          ),
                                        ),
                                      ],
                                    ),
                                  ),
                                ),
                                const SizedBox(width: 10),
                                
                                // Kanan: Ang Lucky Combo Generator Form
                                Expanded(
                                  child: Container(
                                    height: 195,
                                    padding: const EdgeInsets.all(10),
                                    decoration: BoxDecoration(
                                      color: const Color(0xFF131217),
                                      borderRadius: BorderRadius.circular(12),
                                      border: Border.all(color: Colors.white10),
                                    ),
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                      children: [
                                        const Text('Lucky Combination Generator', style: TextStyle(fontSize: 10, color: Colors.white70, fontWeight: FontWeight.bold)),
                                        
                                        // Interactive Zodiac dropdown
                                        Container(
                                          padding: const EdgeInsets.symmetric(horizontal: 8),
                                          height: 36,
                                          decoration: BoxDecoration(color: Colors.black26, borderRadius: BorderRadius.circular(6), border: Border.all(color: Colors.white12)),
                                          child: DropdownButtonHideUnderline(
                                            child: DropdownButton<String>(
                                              value: selectedZodiac,
                                              isExpanded: true,
                                              dropdownColor: const Color(0xFF131217),
                                              style: const TextStyle(fontSize: 12, color: Colors.white70),
                                              items: ['Zodiac', 'Aries', 'Taurus', 'Gemini', 'Leo', 'Virgo', 'Scorpio'].map((String z) {
                                                return DropdownMenuItem<String>(value: z, child: Text(z));
                                              }).toList(),
                                              onChanged: (newZ) => setState(() => selectedZodiac = newZ!),
                                            ),
                                          ),
                                        ),

                                        // Interactive Year input
                                        SizedBox(
                                          height: 36,
                                          child: TextField(
                                            controller: _yearController,
                                            keyboardType: TextInputType.number,
                                            style: const TextStyle(fontSize: 12),
                                            decoration: InputDecoration(
                                              contentPadding: const EdgeInsets.symmetric(horizontal: 8, vertical: 0),
                                              filled: true,
                                              fillColor: Colors.black26,
                                              labelText: 'Birth Year',
                                              labelStyle: const TextStyle(color: Colors.white30, fontSize: 10),
                                              enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(6), borderSide: const BorderSide(color: Colors.white12)),
                                              focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(6), borderSide: const BorderSide(color: Color(0xFFE5A93C))),
                                            ),
                                          ),
                                        ),

                                        // Premium Calculate Button (with interactive state change)
                                        SizedBox(
                                          width: double.infinity,
                                          height: 34,
                                          child: ElevatedButton(
                                            onPressed: isCalculating ? null : _calculateLuckyCombination,
                                            style: ElevatedButton.styleFrom(
                                              backgroundColor: const Color(0xFF1E1610),
                                              side: const BorderSide(color: Color(0xFFE5A93C), width: 1.2),
                                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(6)),
                                            ),
                                            child: isCalculating 
                                              ? const SizedBox(width: 14, height: 14, child: CircularProgressIndicator(strokeWidth: 2, color: Color(0xFFE5A93C)))
                                              : const Text('Calculate', style: TextStyle(color: Color(0xFFE5A93C), fontSize: 12, fontWeight: FontWeight.bold)),
                                          ),
                                        ),
                                      ],
                                    ),
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 14),

                            // --- BALL ROW LISTING (Eksaktong look sa image mo!) ---
                            ...currentCombinations.map((combo) => _buildLottoPremiumRow(combo)),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
                
                // Floating Action Circle (Plus Sign)
                floatingActionButton: FloatingActionButton(
                  backgroundColor: const Color(0xFF231338),
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(14),
                    side: const BorderSide(color: Color(0xFFE5A93C), width: 1.5),
                  ),
                  onPressed: _calculateLuckyCombination,
                  child: const Icon(Icons.add, color: Color(0xFFE5A93C), size: 26),
                ),
              );
            }

            // Custom Tab Item Renderer
            Widget _buildTabItem(int index, IconData icon, String label) {
              bool isSelected = currentActiveTab == index;
              return GestureDetector(
                onTap: () => setState(() => currentActiveTab = index),
                child: Container(
                  padding: const EdgeInsets.symmetric(vertical: 4),
                  decoration: BoxDecoration(
                    border: isSelected ? const Border(bottom: BorderSide(color: Color(0xFFE5A93C), width: 2)) : null,
                  ),
                  child: Column(
                    children: [
                      Icon(icon, color: isSelected ? const Color(0xFFE5A93C) : Colors.white30, size: 20),
                      const SizedBox(height: 4),
                      Text(
                        label.split(' ').first,
                        style: TextStyle(
                          fontSize: 9, 
                          fontWeight: isSelected ? FontWeight.bold : FontWeight.normal, 
                          color: isSelected ? const Color(0xFFE5A93C) : Colors.white30
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildSquareActionBtn(IconData icon) {
              return Container(
                width: 34,
                height: 34,
                decoration: BoxDecoration(
                  color: const Color(0xFF17161D),
                  borderRadius: BorderRadius.circular(6),
                  border: Border.all(color: Colors.white10),
                ),
                child: Icon(icon, size: 16, color: Colors.white70),
              );
            }

            // Custom built-in elegant Bar indicator
            Widget _buildCustomBarIndicator(double indicatorHeight, Color barColor, String xLabel) {
              return Column(
                mainAxisAlignment: MainAxisAlignment.end,
                children: [
                  Container(
                    width: 10,
                    height: indicatorHeight * 2.1,
                    decoration: BoxDecoration(
                      color: barColor,
                      borderRadius: BorderRadius.circular(2),
                    ),
                  ),
                  const SizedBox(height: 5),
                  Text(xLabel, style: const TextStyle(fontSize: 8, color: Colors.white38)),
                ],
              );
            }

            // Custom Card row for standard and premium winning balls
            Widget _buildLottoPremiumRow(List<int> ballNumbers) {
              return Container(
                margin: const EdgeInsets.only(bottom: 8),
                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 12),
                decoration: BoxDecoration(
                  color: const Color(0xFF131217),
                  borderRadius: BorderRadius.circular(12),
                  border: Border.all(color: Colors.white10),
                ),
                child: Row(
                  children: [
                    const Icon(Icons.star, color: Color(0xFFE5A93C), size: 16),
                    const SizedBox(width: 8),
                    
                    // Render ng 5 Bolas
                    Expanded(
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: ballNumbers.map((num) => Container(
                          width: 32,
                          height: 32,
                          decoration: const BoxDecoration(
                            color: Color(0xFF201F29),
                            shape: BoxShape.circle,
                          ),
                          child: Center(
                            child: Text(
                              num.toString().padLeft(2, '0'),
                              style: const TextStyle(color: Color(0xFFE5A93C), fontWeight: FontWeight.bold, fontSize: 12),
                            ),
                          ),
                        )).toList(),
                      ),
                    ),
                    const SizedBox(width: 8),
                    
                    // Match indicators
                    Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: const [
                        Text('94%', style: TextStyle(color: Color(0xFFE5A93C), fontWeight: FontWeight.bold, fontSize: 13)),
                        Text('Match', style: TextStyle(fontSize: 8, color: Colors.white38)),
                      ],
                    ),
                    const SizedBox(width: 10),
                    
                    // Save Button
                    SizedBox(
                      height: 28,
                      child: OutlinedButton(
                        onPressed: () {
                          ScaffoldMessenger.of(context).showSnackBar(
                            SnackBar(
                              content: Text('💾 Kombinasyon $ballNumbers ay ligtas na na-save!'),
                              backgroundColor: Colors.green[800],
                            ),
                          );
                        },
                        style: OutlinedButton.styleFrom(
                          side: const BorderSide(color: Colors.white24),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(6)),
                          padding: const EdgeInsets.symmetric(horizontal: 10),
                        ),
                        child: const Text('Save', style: TextStyle(color: Colors.white70, fontSize: 11)),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF
          
          # Huling pagluluto ng APK file
          flutter build apk --release

      - name: Upload Premium APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Premium-Gold
          path: lotto_app_built/build/app/outputs/flutter-apk/app-release.apk
