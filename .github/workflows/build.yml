name: Auto-Sync Lotto Scraper & APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

  build_apk:
    runs-on: ubuntu-latest
    needs: sync_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Create Premium Gold App
        run: |
          flutter create --org com.example lotto_premium
          cd lotto_premium
          flutter pub add firebase_core cloud_firestore fl_chart font_awesome_flutter google_fonts
          
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:fl_chart/fl_chart.dart';
          import 'package:font_awesome_flutter/font_awesome_flutter.dart';
          import 'package:google_fonts/google_fonts.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Firebase.initializeApp(
                options: const FirebaseOptions(
                  apiKey: 'AIzaSyA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q', 
                  projectId: 'lotto-asintado',
                  appId: '1:458447298380:android:308fd26da180954e40b9e9',
                  messagingSenderId: '458447298380',
                  storageBucket: 'lotto-asintado.appspot.com',
                ),
              );
            } catch (e) {}
            runApp(const LottoAsintadoApp());
          }

          class LottoAsintadoApp extends StatelessWidget {
            const LottoAsintadoApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0D0D11),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            List<List<int>> generatedCombinations = [[11, 25, 38, 50, 67], [11, 25, 38, 50, 67], [11, 25, 38, 50, 67]];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF16161F),
                  elevation: 0,
                  leading: const Icon(Icons.stars, color: Color(0xFFFFD700), size: 30),
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: const [
                      Text('LOTTO ASINTADO STRATEGY PRO', style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: Colors.white)),
                      Text('Developer: Renante Fullo', style: TextStyle(fontSize: 12, color: Colors.white54)),
                    ],
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(colors: [Color(0xFF231B15), Color(0xFF16161F)]),
                          borderRadius: BorderRadius.circular(20),
                          border: Border.all(color: Colors.amber.withOpacity(0.3)),
                        ),
                        child: Row(
                          children: [
                            Container(
                              padding: const EdgeInsets.all(12),
                              decoration: BoxDecoration(color: Colors.red.withOpacity(0.2), shape: BoxShape.circle),
                              child: const Text('6/42\nLOTTO', textAlign: TextAlign.center, style: TextStyle(color: Colors.redAccent, fontSize: 10, fontWeight: FontWeight.bold)),
                            ),
                            const SizedBox(width: 20),
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: const [
                                Text('Next Draw: 6/42 Lotto', style: TextStyle(color: Colors.white70, fontSize: 14)),
                                Text('P35,500,000', style: TextStyle(color: Color(0xFFFFD700), fontSize: 28, fontWeight: FontWeight.bold)),
                              ],
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceAround,
                        children: const [
                          _NavIcon(icon: Icons.list_alt, label: 'MY COMBINATIONS'),
                          _NavIcon(icon: Icons.local_fire_department, label: 'HOT NUMBERS'),
                          _NavIcon(icon: Icons.menu_book, label: 'STRATEGY GUIDE', active: true),
                          _NavIcon(icon: Icons.history, label: 'MY HISTORY'),
                        ],
                      ),
                      const SizedBox(height: 25),
                      Row(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Expanded(
                            child: Container(
                              height: 180,
                              padding: const EdgeInsets.all(12),
                              decoration: BoxDecoration(color: const Color(0xFF16161F), borderRadius: BorderRadius.circular(15)),
                              child: BarChart(BarChartData(
                                borderData: FlBorderData(show: false),
                                barGroups: [
                                  BarChartGroupData(x: 1, barRods: [BarChartRodData(toY: 8, color: Colors.pink, width: 8)]),
                                  BarChartGroupData(x: 2, barRods: [BarChartRodData(toY: 10, color: Colors.orangeAccent, width: 8)]),
                                  BarChartGroupData(x: 3, barRods: [BarChartRodData(toY: 7, color: Colors.yellowAccent, width: 8)]),
                                  BarChartGroupData(x: 4, barRods: [BarChartRodData(toY: 12, color: Colors.greenAccent, width: 8)]),
                                  BarChartGroupData(x: 5, barRods: [BarChartRodData(toY: 9, color: Colors.blueAccent, width: 8)]),
                                ],
                              )),
                            ),
                          ),
                          const SizedBox(width: 15),
                          Expanded(
                            child: Container(
                              height: 180,
                              padding: const EdgeInsets.all(12),
                              decoration: BoxDecoration(color: const Color(0xFF16161F), borderRadius: BorderRadius.circular(15)),
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.spaceAround,
                                children: [
                                  const Text('Lucky Generator', style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: Colors.white)),
                                  Container(height: 35, width: double.infinity, color: Colors.black26, child: const Center(child: Text('Zodiac', style: TextStyle(color: Colors.white70)))),
                                  Container(height: 35, width: double.infinity, color: Colors.black26, child: const Center(child: Text('1951', style: TextStyle(color: Colors.white70)))),
                                  ElevatedButton(onPressed: (){}, style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF231B15), foregroundColor: Colors.amber), child: const Text('Calculate', style: TextStyle(fontSize: 10))),
                                ],
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 20),
                      ...generatedCombinations.map((c) => _CombinationTile(numbers: c)),
                    ],
                  ),
                ),
              );
            }
          }

          class _NavIcon extends StatelessWidget {
            final IconData icon; final String label; final bool active;
            const _NavIcon({required this.icon, required this.label, this.active = false});
            @override Widget build(BuildContext context) {
              return Column(children: [
                Icon(icon, color: active ? const Color(0xFFFFD700) : Colors.white30, size: 24),
                const SizedBox(height: 5),
                Text(label.split(' ').first, style: TextStyle(fontSize: 8, color: active ? const Color(0xFFFFD700) : Colors.white30)),
              ]);
            }
          }

          class _CombinationTile extends StatelessWidget {
            final List<int> numbers;
            const _CombinationTile({required this.numbers});
            @override Widget build(BuildContext context) {
              return Container(
                margin: const EdgeInsets.only(bottom: 10),
                padding: const EdgeInsets.all(15),
                decoration: BoxDecoration(color: const Color(0xFF16161F), borderRadius: BorderRadius.circular(15)),
                child: Row(
                  children: [
                    const Icon(Icons.star, color: Color(0xFFFFD700), size: 16),
                    const SizedBox(width: 10),
                    Expanded(child: Row(mainAxisAlignment: MainAxisAlignment.spaceAround, children: numbers.map((n) => Container(padding: const EdgeInsets.all(8), decoration: const BoxDecoration(color: Color(0xFF262633), shape: BoxShape.circle), child: Text(n.toString(), style: const TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold, fontSize: 12)))).toList())),
                    Column(children: const [Text('94%', style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold)), Text('Match', style: TextStyle(fontSize: 8, color: Colors.white54))]),
                    const SizedBox(width: 10),
                    TextButton(onPressed: (){}, child: const Text('Save', style: TextStyle(color: Colors.white70))),
                  ],
                ),
              );
            }
          }
          EOF
          
          flutter build apk --release

      - name: Upload Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Premium-Gold
          path: lotto_premium/build/app/outputs/flutter-apk/app-release.apk
