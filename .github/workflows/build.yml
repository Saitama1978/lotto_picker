name: Build Android APK and Update Data

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # =========================================================
      # BAHAGI 1: DATABASE TRIGGER (FIREBASE MULTI-GAME UPDATE)
      # =========================================================
      - name: Install Firebase Dependency
        run: npm install firebase-admin

      - name: Run Database Update
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          echo "$FIREBASE_KEY" > serviceAccountKey.json
          node -e "
          const admin = require('firebase-admin');
          const serviceAccount = require('./serviceAccountKey.json');
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: 'https://lotto-asintado-default-rtdb.asia-southeast1.firebasedatabase.app'
          });
          const db = admin.database();
          async function run() {
            try {
              // Live 3D Data
              await db.ref('pcso_data/3D/result').set('9-2-5');
              await db.ref('pcso_data/3D/history/2pm').set('9-5-2');
              await db.ref('pcso_data/3D/history/5pm').set('4-7-1');
              await db.ref('pcso_data/3D/history/9pm').set('3-0-8');
              
              // Live 2D Data Fallback
              await db.ref('pcso_data/2D/result').set('24-11');
              
              // Live Grandes Lotto Fallbacks (Para may laman ang 6-42 at iba pa)
              await db.ref('pcso_data/6-42/result').set('08-15-22-29-35-41');
              await db.ref('pcso_data/6-45/result').set('02-12-24-31-39-44');
              
              console.log('Firebase Multi-Game Database Updated!');
              process.exit(0);
            } catch(e) {
              console.error(e);
              process.exit(1);
            }
          }
          run();
          "

      # =========================================================
      # BAHAGI 2: FRESH WORKSPACE & ICON FORCE GENERATOR
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Generate Fresh Flutter App Framework
        run: |
          flutter create --platforms android fresh_app

      - name: Configure Android SDK Version for Firebase
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' fresh_app/android/app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/g' fresh_app/android/app/build.gradle

      - name: Merge Source Code and Logo Assets
        run: |
          # Kopyahin ang lib folder
          cp -r lotto_picker/lib fresh_app/
          
          # PINALAKAS NA PUBSPEC WITH FIREBASE LIVE PLUGINS AT ASSETS CONFIG
          cat << 'EOF' > fresh_app/pubspec.yaml
          name: fresh_app
          description: "PH Lotto Asintado Pro"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^2.27.0
            firebase_database: ^10.4.9

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_launcher_icons: ^0.13.1

          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "assets/logo.png"
            remove_alpha_ios: true
          EOF

          # Gumawa ng malinis na assets folder at ilagay ang logo mo dun
          mkdir -p fresh_app/assets
          find lotto_picker -name "*.png" -exec cp {} fresh_app/assets/logo.png \; 2>/dev/null || true
          
          # Kung sakaling walang nahanap na png, gumawa ng fallback para hindi mag-error ang icon build
          if [ ! -f fresh_app/assets/logo.png ]; then
            cp fresh_app/android/app/src/main/res/mipmap-hdpi/ic_launcher.png fresh_app/assets/logo.png 2>/dev/null || true
          fi

      - name: Inject Firebase Google Services JSON
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -z "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > fresh_app/android/app/google-services.json
          fi

      - name: Force Build Flutter Launcher Icons
        run: |
          cd fresh_app
          flutter pub get
          flutter pub run flutter_launcher_icons:main || true

      - name: Build Final Release APK
        run: |
          cd fresh_app
          flutter build apk --release

      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
