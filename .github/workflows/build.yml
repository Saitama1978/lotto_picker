name: Lotto Auto Update

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase Admin
        run: npm install firebase-admin

      # Dito natin isusulat nang maayos ang script sa isang hiwalay na file bago patakbuhin
      - name: Run Update Script
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          echo "$FIREBASE_KEY" > serviceAccountKey.json
          
          cat << 'EOF' > update_script.js
          const admin = require("firebase-admin");
          const serviceAccount = require("./serviceAccountKey.json");
          
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: "https://lotto-asintado-default-rtdb.asia-southeast1.firebasedatabase.app"
          });
          
          const db = admin.database();
          
          // Diretsong pagsusulat sa database nodes mo
          async function startUpdate() {
            try {
              await db.ref("pcso_data/3D/result").set("9-2-5");
              await db.ref("pcso_data/3D/history/2pm").set("9-5-2");
              await db.ref("pcso_data/3D/history/5pm").set("4-7-1");
              await db.ref("pcso_data/3D/history/9pm").set("3-0-8");
              console.log("Solid! Tagumpay ang pag-update sa Cloud at History!");
              process.exit(0);
            } catch (error) {
              console.error("May sumabit sa database update:", error);
              process.exit(1);
            }
          }
          
          startUpdate();
          EOF
          
          node update_script.js
