name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Clean Flutter Project
        run: |
          cd lotto_picker
          flutter clean

      - name: Force Legacy Firebase Versions
        run: |
          cd lotto_picker
          # Saktong itatama ang match ng firebase_core at firebase_database base sa log
          sed -i 's/firebase_core:.*/firebase_core: 2.15.1/g' pubspec.yaml
          sed -i 's/firebase_core_web:.*/firebase_core_web: 2.15.1/g' pubspec.yaml
          sed -i 's/firebase_database:.*/firebase_database: 10.2.5/g' pubspec.yaml

      - name: Install dependencies
        run: |
          cd lotto_picker
          flutter pub get

      - name: Build APK (Legacy Release)
        run: |
          cd lotto_picker
          flutter build apk --release --no-sound-null-safety

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
