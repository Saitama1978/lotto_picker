name: Build and Auto-Sync Lotto App

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 🔥 1. AUTO-SCRAPER SYNC
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

      # ☕ 2. JAVA SETUP NA COMPATIBLE SA APPS MO
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # 📱 3. CLASSIC FLUTTER ENGINE (Hindi mapili sa embedding)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.7.12'

      # 🛠️ 4. REAL APK COMPILATION
      - name: Install Dependencies and Build Real APK
        run: |
          cd lotto_picker
          flutter clean
          flutter pub get
          flutter build apk --release --no-sound-null-safety

      # 🚀 5. ANG TUNAY AT MALAKING DOWNLOAD LINK
      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: PH-Lotto-Asintado-Pro-RealAPK
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
