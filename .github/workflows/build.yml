name: Auto-Sync Lotto Scraper & APK Builder

on:
  push:
    branches:
      - main

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

  build_apk:
    runs-on: ubuntu-latest
    needs: sync_data
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter Build Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Cmake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Create and Inject Premium UI
        run: |
          flutter create --org com.example lotto_premium
          cd lotto_premium
          # I-add ang lahat ng kailangang tools
          flutter pub add firebase_core cloud_firestore fl_chart font_awesome_flutter
          
          # HETO ANG BUONG PREMIUM CODE
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:fl_chart/fl_chart.dart';
          import 'package:font_awesome_flutter/font_awesome_flutter.dart';
          import 'dart:math';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await Firebase.initializeApp(
                options: const FirebaseOptions(
                  apiKey: 'AIzaSyA1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q', 
                  projectId: 'lotto-asintado',
                  appId: '1:458447298380:android:308fd26da180954e40b9e9',
                  messagingSenderId: '458447298380',
                  storageBucket: 'lotto-asintado.appspot.com',
                ),
              );
            } catch (e) {}
            runApp(const LottoAsintadoApp());
          }

          class LottoAsintadoApp extends StatelessWidget {
            const LottoAsintadoApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0D0D11),
                  primaryColor: const Color(0xFFFFD700),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            String selectedGame = '6/42';
            String cloudResult = "00-00-00-00-00-00";
            String jackpotPrize = "P35,000,000";
            List<List<int>> generatedCombinations = [];

            void calculateCombinations() {
              final random = Random();
              setState(() {
                generatedCombinations = List.generate(3, (_) => List.generate(6, (_) => random.nextInt(42) + 1));
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF16161F),
                  title: const Text('LOTTO ASINTADO PRO', style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                ),
                body: StreamBuilder<DocumentSnapshot>(
                  stream: FirebaseFirestore.instance.collection('pcso_data').doc(selectedGame.replaceAll('/', '-')).snapshots(),
                  builder: (context, snapshot) {
                    if (snapshot.hasData && snapshot.data!.exists) {
                      var data = snapshot.data!.data() as Map<String, dynamic>;
                      cloudResult = (data['result'] ?? data['numbers'] ?? '---').toString();
                      jackpotPrize = (data['jackpot'] ?? '---').toString();
                    }
                    return SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          // Jackpot Card
                          Container(
                            padding: const EdgeInsets.all(20),
                            decoration: BoxDecoration(
                              gradient: const LinearGradient(colors: [Color(0xFF231B15), Color(0xFF16161F)]),
                              borderRadius: BorderRadius.circular(20),
                              border: Border.all(color: Colors.amber.withOpacity(0.3)),
                            ),
                            child: Column(
                              children: [
                                Text('$selectedGame Current Result', style: const TextStyle(color: Colors.white70)),
                                const SizedBox(height: 10),
                                Text(cloudResult, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.white)),
                                const Divider(color: Colors.white10, height: 30),
                                Text(jackpotPrize, style: const TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Color(0xFFFFD700))),
                              ],
                            ),
                          ),
                          const SizedBox(height: 20),
                          // Charts Section
                          SizedBox(
                            height: 200,
                            child: BarChart(BarChartData(
                              barGroups: [
                                BarChartGroupData(x: 0, barRods: [BarChartRodData(toY: 8, color: Colors.amber)]),
                                BarChartGroupData(x: 1, barRods: [BarChartRodData(toY: 10, color: Colors.orange)]),
                                BarChartGroupData(x: 2, barRods: [BarChartRodData(toY: 14, color: Colors.red)]),
                              ],
                            )),
                          ),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700), foregroundColor: Colors.black),
                            onPressed: calculateCombinations,
                            child: const Text('GENERATE LUCKY NUMBERS'),
                          ),
                          const SizedBox(height: 20),
                          ...generatedCombinations.map((c) => Card(
                            color: const Color(0xFF16161F),
                            child: ListTile(
                              title: Text(c.join(' - '), style: const TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                              trailing: const Icon(Icons.star, color: Colors.amber),
                            ),
                          )),
                        ],
                      ),
                    );
                  }
                ),
              );
            }
          }
          EOF
          
          # BUILD THE APK
          flutter build apk --release

      - name: Upload Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Premium-Gold
          path: lotto_premium/build/app/outputs/flutter-apk/app-release.apk
