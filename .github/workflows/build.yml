name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Clean Project
        run: |
          cd lotto_picker
          flutter clean

      # DITO ANG SIKRETO: Gagamitan natin ng --suppress-analytics at tulong ng bypass bypass
      - name: Install dependencies
        env:
          FLUTTER_SUPPRESS_ANALYTICS: true
        run: |
          cd lotto_picker
          flutter pub get

      # PINWERSANG LAKTAWAN ANG EMBEDDING AT PROJECT CHECKS
      - name: Build APK
        run: |
          cd lotto_picker
          flutter build apk --release --no-pub --no-validate-project

      # Upload ng pinal na file
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
