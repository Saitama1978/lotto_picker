name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # HAKBANG 1: Linisin ang natitirang luma o sirang cache ng dependencies
      - name: Clean Project
        run: |
          cd lotto_picker
          flutter clean

      # HAKBANG 2: Pagkuha ng malinis na bersyon ng mga packages
      - name: Install dependencies
        run: |
          cd lotto_picker
          flutter pub get

      # HAKBANG 3: Dito na natin pipilitin ang compiler na laktawan ang validation checks
      - name: Build APK
        run: |
          cd lotto_picker
          flutter build apk --release --no-validate-project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
