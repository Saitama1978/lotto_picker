name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Generate Fresh Flutter App
        run: |
          flutter create --platforms android fresh_app

      # MAGIC FIX: Pinapalitan ang maling Icons.target bago ilipat sa fresh_app
      - name: Fix Target Icon Syntax Error
        run: |
          sed -i 's/Icons.target/Icons.track_changes/g' lotto_picker/lib/main.dart

      - name: Merge Source Code to Fresh App
        run: |
          rm -f fresh_app/pubspec.yaml
          cp -r lotto_picker/lib fresh_app/
          cp lotto_picker/pubspec.yaml fresh_app/

      - name: Install dependencies & Build APK
        run: |
          cd fresh_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
