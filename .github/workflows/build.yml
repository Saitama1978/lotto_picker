name: Auto-Sync Lotto Scraper to Firestore

on:
  push:
    branches:
      - main
  schedule:
    # ⏱️ TATAKBO KUSA GABI-GABI: Tuwing alas-9:30 PM ng gabi (Philippine Time)
    - cron: '30 13 * * *'

jobs:
  sync_database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 🔥 DITO DIRETSONG MAG-A-UPDATE ANG FIRESTORE MO NANG WALANG ANDROID CORES
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js
