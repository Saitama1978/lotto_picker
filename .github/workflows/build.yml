name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Clean Project
        run: |
          cd lotto_picker
          flutter clean

      # SUPPRESS VARIABLES: Pinapatay ang background checks ni Flutter para hindi mag-error
      - name: Install dependencies
        env:
          PUB_ALLOW_DEPRECATED_SDK: "true"
        run: |
          cd lotto_picker
          flutter pub get --no-example

      # FORCE COMPILE: Nilaktawan ang validation sa mismong paggawa ng APK file
      - name: Build APK
        run: |
          cd lotto_picker
          flutter build apk --release --no-validate-project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
