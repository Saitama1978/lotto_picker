  build_apk:
    runs-on: ubuntu-latest
    needs: sync_data
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Compile and Inject Premium Gold Code
        run: |
          # Itabi muna ang iyong totoong icon para hindi mabura ng 'flutter create'
          mkdir -p /tmp/user_icon
          if [ -f "assets/icon/app_icon.png" ]; then
            cp assets/icon/app_icon.png /tmp/user_icon/
          elif [ -f "assets/icon/icon.png" ]; then
            cp assets/icon/icon.png /tmp/user_icon/app_icon.png
          fi

          rm -rf lotto_app_built
          flutter create --org com.renantefullo.lottoasintado lotto_app_built
          cd lotto_app_built
          
          # I-install ang mga kailangang packages
          flutter pub add google_fonts
          flutter pub add --dev flutter_launcher_icons
          
          # Ibalik ang totoong icon mo sa bagong gawang project folder
          mkdir -p assets/icon
          if [ -f "/tmp/user_icon/app_icon.png" ]; then
            cp /tmp/user_icon/app_icon.png assets/icon/app_icon.png
          else
            # Kung sakaling walang mahanap na icon, gagawa ng blankong backup para hindi mag-error
            touch assets/icon/app_icon.png
          fi
          
          # Isulat ang configuration file para sa app icon gamit ang totoong larawan mo
          cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: true
            image_path: "assets/icon/app_icon.png"
          EOF
          
          # Patakbuhin ang icon generator plugin
          flutter pub run flutter_launcher_icons
          
          # Isulat ang pinaka-espesyal na main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'dart:math';

          void main() {
            runApp(const LottoAsintadoPremiumApp());
          }

          class LottoAsintadoPremiumApp extends StatelessWidget {
            const LottoAsintadoPremiumApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Lotto Asintado Strategy Pro',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F0E13), 
                  primaryColor: const Color(0xFFE5A93C), 
                ),
                home: const PremiumDashboardScreen(),
              );
            }
          }

          class PremiumDashboardScreen extends StatefulWidget {
            const PremiumDashboardScreen({super.key});
            @override
            State<PremiumDashboardScreen> createState() => _PremiumDashboardScreenState();
          }

          class _PremiumDashboardScreenState extends State<PremiumDashboardScreen> {
            String selectedGame = '6/42';
            String selectedZodiac = 'Zodiac';
            final TextEditingController _yearController = TextEditingController(text: '1951');
            int currentActiveTab = 2; 
            bool isCalculating = false;

            final Map<String, String> jackpotPools = {
              '6/42': '₱35,500,000',
              '6/45': '₱58,200,000',
