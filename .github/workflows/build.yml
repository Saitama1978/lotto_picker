name: Build and Auto-Sync Lotto App

on:
  push:
    branches:
      - main
  schedule:
    # ⏱️ TATAKBO KUSA GABI-GABI: Tuwing alas-9:30 PM ng gabi (Philippine Time)
    - cron: '30 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 🔥 DITO TATAKBO ANG AUTO-SCRAPER PARA MAG-UPDATE ANG FIRESTORE MO
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

      # 📱 DITO MAGSISIMULA ANG PAG-BUILD NG PREMIUM APK MO
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Install Dependencies and Build APK
        run: |
          cd lotto_picker
          flutter pub get
          flutter build apk --release

      # 🚀 KINORREK NA DITO: Ginamit na ang v4 para mawala ang pulang 'x'
      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: PH-Lotto-Asintado-Pro
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
