name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # In-update sa v4 para hindi harangin ng GitHub
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # In-update sa v4 para sa pinakabagong compatibility
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Install dependencies
        run: |
          cd lotto_picker/lotto_picker
          flutter pub get

      - name: Build APK
        run: |
          cd lotto_picker/lotto_picker
          flutter build apk --release

      # DITO ANG CRITICAL CHANGE: Binago natin mula v3 papuntang v4
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: lotto_picker/lotto_picker/build/app/outputs/flutter-apk/app-release.apk
