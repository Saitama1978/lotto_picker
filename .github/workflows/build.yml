name: Build Android APK and Update Data

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # =========================================================
      # BAHAGI 1: DATABASE TRIGGER (FIREBASE UPDATE)
      # =========================================================
      - name: Install Firebase Dependency
        run: npm install firebase-admin

      - name: Run Database Update
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          echo "$FIREBASE_KEY" > serviceAccountKey.json
          node -e "
          const admin = require('firebase-admin');
          const serviceAccount = require('./serviceAccountKey.json');
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: 'https://lotto-asintado-default-rtdb.asia-southeast1.firebasedatabase.app'
          });
          const db = admin.database();
          async function run() {
            try {
              await db.ref('pcso_data/3D/result').set('9-2-5');
              await db.ref('pcso_data/3D/history/2pm').set('9-5-2');
              await db.ref('pcso_data/3D/history/5pm').set('4-7-1');
              await db.ref('pcso_data/3D/history/9pm').set('3-0-8');
              console.log('Firebase Updated Successfully');
              process.exit(0);
            } catch(e) {
              console.error(e);
              process.exit(1);
            }
          }
          run();
          "

      # =========================================================
      # BAHAGI 2: DIRETSONG APK COMPILATION SA 'LOTTO_PICKER'
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # Dito natin isasaksak ang google-services.json sa loob mismo ng android/app mo
      - name: Inject Firebase Google Services JSON
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -z "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > lotto_picker/android/app/google-services.json
          fi

      # Pinipilit nating baguhin ang minSdkVersion sa orihinal mong folder para hindi mag-error sa Firebase
      - name: Force Fix Android MinSdkVersion
        run: |
          if [ -f "lotto_picker/android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' lotto_picker/android/app/build.gradle
            sed -i 's/flutter.minSdkVersion/21/g' lotto_picker/android/app/build.gradle
          fi

      - name: Fix Target Icon Code Bug
        run: |
          if [ -f "lotto_picker/lib/main.dart" ]; then
            sed -i 's/Icons.target/Icons.track_changes/g' lotto_picker/lib/main.dart
          fi

      # Dito na gagawin ang pagluluto ng Icon at pag-build ng APK sa tamang folder
      - name: Build Flutter Launcher Icons & APK
        run: |
          cd lotto_picker
          flutter pub get
          flutter pub run flutter_launcher_icons:main || true
          flutter build apk --release

      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
