name: Build and Auto-Sync Lotto App

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 🔥 AUTO-SCRAPER SYNC
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

      # ☕ JAVA SETUP
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 📱 MODERN FLUTTER ENGINE
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.16.0'

      # 🛠️ AUTOMATIC INJECTION BYPASS
      - name: Inject V2 Embedding and Build APK
        run: |
          cd lotto_picker
          flutter clean
          
          # 🚀 ATACK ENGINE: Awtomatikong itatama ng script na ito ang manifest kahit nasaan pa itong subfolder!
          find . -name "AndroidManifest.xml" -exec sed -i '/<activity/a \        <meta-data android:name="flutterEmbedding" android:value="2" />' {} \;
          
          # Pwersahang pagbuo ng kulang na MainActivity structure sa tamang lokasyon
          mkdir -p android/app/src/main/kotlin/com/example/lotto_picker
          echo -e "package com.example.lotto_picker\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}" > android/app/src/main/kotlin/com/example/lotto_picker/MainActivity.kt
          
          flutter pub get
          # I-compile na ang APK nang walang validation checks
          flutter build apk --release --no-sound-null-safety

      # 🚀 AUTOMATIC UPLOAD
      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: PH-Lotto-Asintado-Pro
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
