name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Recreate Android Project Folder
        run: |
          cd lotto_picker
          flutter create --platforms android .

      - name: Clean Project
        run: |
          cd lotto_picker
          flutter clean

      - name: Install dependencies
        run: |
          cd lotto_picker
          flutter pub get

      # TINANGGAL NA ANG MAKULIT NA FLAG PARA DIRETSO BUILD NA
      - name: Build APK
        run: |
          cd lotto_picker
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lotto-Asintado-Release-APK
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
