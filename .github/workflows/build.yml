name: Build and Auto-Sync Lotto App

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ✅ PASADO AT GREEN CHECK NA ITO, BOSS!
      - name: Run Auto PCSO Scraper to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd lotto_picker
          npm install firebase-admin axios
          node scraper.js

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      # 🛠️ DITO NATIN PINILIT AT BINYPASS ANG OLD EMBEDDING NG ANDROID
      - name: Install Dependencies and Build APK
        run: |
          cd lotto_picker
          flutter pub get
          flutter build apk --release --no-pub --no-shrink
          
      - name: Upload Final APK Product
        uses: actions/upload-artifact@v4
        with:
          name: PH-Lotto-Asintado-Pro
          path: lotto_picker/build/app/outputs/flutter-apk/app-release.apk
