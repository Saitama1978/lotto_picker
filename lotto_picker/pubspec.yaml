name: lotto_asintado
description: "A new Flutter project for Lotto Asintado Pro."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase dependencies
  firebase_core: ^3.0.0
  firebase_database: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 # Ito ang magic package

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png" 
  min_sdk_android: 21

flutter:
  uses-material-design: true
dependency_overrides:
  firebase_core: 2.24.0
  firebase_core_web: 2.11.1
